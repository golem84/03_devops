---
- name: try-debug
  hosts: webservers
  remote_user: runner
  become: yes
  become_method: sudo

  tasks:
  - name: Ensure nmap installed
    ansible.builtin.apt:
      name: nmap
      state: present

  - name: Check nmap installed
    ansible.builtin.shell: nmap -V
    register: nmapversion

  - name: Debug message
    ansible.builtin.debug:
    msg: "nmap version: {{ nmapversion.stdout }}"
      