---
- name: try-debug
  hosts: webservers
  remote_user: runner
  become: yes
  become_method: sudo

  tasks:
  - name: Ensure nmap installed
    ansible.builtin.apt:
      name: nmap
      state: present

  - name: Check nmap installed
    ansible.builtin.shell: nmap -v | jq -Rs 'split(" ")' | jq -r .[2]
    register: nmapversion

  - name: Debug message
    ansible.builtin.debug:
      msg: "nmap version: {{ nmapversion.stdout }}"
      
  - name: Copy targets
    ansible.builtin.copy:
      src: ./targets.txt
      dest: ~/targets.txt

  - name: Ensure targets exists
    ansible.builtin.file:
      path: .
      patterns: 'target.txt'
    register: file-name

  - name: Debug file exists
    ansible.builtin.debug:
      msg: "file not found..."
    when: file-name.stdout==""

  