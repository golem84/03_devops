---
- name: try-debug
  hosts: webservers
  remote_user: runner
  become: yes
  become_method: sudo

  tasks:
  - name: Ensure nmap installed
    ansible.builtin.apt:
      name: nmap
      state: present

  - name: Copy targets
    ansible.builtin.copy:
      src: ./targets.txt
      dest: ~/targets.txt
      force: yes

  - name: Run nmap
    ansible.builtin.command: nmap -iL ~/targets.txt -oG -
    register: nmap_results

  - name: Print nmap results
    ansible.builtin.debug:
      msg: "{{ nmap_results.stdout }}"