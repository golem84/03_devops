---
- name: try-debug
  hosts: webservers
  remote_user: runner
  become: yes
  become_method: sudo

  tasks:
  - name: Ensure nmap installed
    ansible.builtin.apt:
      name: nmap
      state: present

  - name: Copy targets
    ansible.builtin.copy:
      src: ./targets.txt
      dest: ~/targets.txt
      force: yes