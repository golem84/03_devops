---
- name: try-debug
  hosts: webservers
  remote_user: runner
  become: yes
  become_method: sudo

  tasks:
  - name: Echo message
    ansible.builtin.shell: hostname
    register: host_name

  - name: Debug message
    ansible.builtin.debug:
      msg: " {{ host_name.stdout_lines }} "
      var: host_name
      